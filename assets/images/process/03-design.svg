<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Design — craft and composition">
  <defs>
    <radialGradient id="d3-field" cx="45%" cy="38%" r="92%">
      <stop offset="0%" stop-color="#6e3a16"/>
      <stop offset="45%" stop-color="#46220e"/>
      <stop offset="100%" stop-color="#1c0d05"/>
    </radialGradient>
    <linearGradient id="d3-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd9a8"/>
      <stop offset="100%" stop-color="#e08a36"/>
    </linearGradient>
    <linearGradient id="d3-b" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4722a"/>
      <stop offset="100%" stop-color="#9a4f1c"/>
    </linearGradient>
    <linearGradient id="d3-sheen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="d3-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#d3-field)"/>
  <rect width="800" height="1000" fill="url(#d3-sheen)"/>

  <!-- soft glow -->
  <circle cx="380" cy="420" r="260" fill="#e08a36" opacity="0.35" filter="url(#d3-soft)"/>

  <!-- overlapping translucent layers -->
  <g style="mix-blend-mode:screen">
    <circle cx="300" cy="380" r="160" fill="url(#d3-a)" opacity="0.55"/>
    <rect x="350" y="300" width="230" height="230" rx="28" fill="url(#d3-b)" opacity="0.5" transform="rotate(12 465 415)"/>
    <polygon points="430,250 560,480 300,480" fill="#ffd9a8" opacity="0.30"/>
  </g>

  <!-- crisp framed layers outline -->
  <rect x="340" y="300" width="220" height="220" rx="24" fill="none" stroke="#ffe6c4" stroke-opacity="0.6" stroke-width="2" transform="rotate(12 450 410)"/>
  <circle cx="300" cy="380" r="160" fill="none" stroke="#ffe6c4" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- flowing bezier curve with handles -->
  <path d="M170 700 C 300 560, 500 760, 640 600" fill="none" stroke="#fff4e3" stroke-opacity="0.85" stroke-width="2.5"/>
  <g stroke="#f0a84e" stroke-opacity="0.7" stroke-width="1.2">
    <line x1="170" y1="700" x2="235" y2="630"/>
    <line x1="640" y1="600" x2="575" y2="680"/>
  </g>
  <g fill="#fff4e3">
    <circle cx="170" cy="700" r="6"/>
    <circle cx="640" cy="600" r="6"/>
  </g>
  <g fill="#f0a84e">
    <circle cx="235" cy="630" r="4"/>
    <circle cx="575" cy="680" r="4"/>
  </g>

  <!-- swatch row -->
  <g>
    <rect x="250" y="800" width="48" height="48" rx="8" fill="#ffd9a8"/>
    <rect x="310" y="800" width="48" height="48" rx="8" fill="#e08a36"/>
    <rect x="370" y="800" width="48" height="48" rx="8" fill="#c4722a"/>
    <rect x="430" y="800" width="48" height="48" rx="8" fill="#7a3d14"/>
  </g>

  <ellipse cx="400" cy="1000" rx="520" ry="170" fill="#5a3010" opacity="0.4" filter="url(#d3-soft)"/>
</svg>
